[project]
name = "jev-counterspeech"
version = "0.1.0"
description = "A responsible counterspeech assistant: Jev (TypeSafe) triages and ranks, a human stays in the loop, nothing is ever posted."
requires-python = ">=3.11"
dependencies = [
  "httpx[http2]>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[project.scripts]
jev-counterspeech = "jev_counterspeech.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_counterspeech"]

[tool.hatch.build.targets.sdist]
include = ["jev_counterspeech", "tests", "README.md", "LICENSE", ".env.example"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requires a real TYPESAFE_API_KEY and makes paid network calls (deselected by default)",
]
addopts = "-m 'not live'"
